name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on origin/main"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - run: bun run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test Android
        run: |
          (cd example && bun install --frozen-lockfile)
          bun run test:android

      # Provenance works with token auth given `id-token: write` above and a public
      # repo; it does not replace auth.
      - name: Publish
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          LATEST="$(npm view "$NAME" dist-tags.latest)"
          NEXT="$(npm view "$NAME" dist-tags.next)"
          higher() {
            node -e '
              const [a, b] = process.argv.slice(1).map((v) => v.split("-")[0].split(".").map(Number))
              const i = [0, 1, 2].find((n) => a[n] !== b[n])
              console.log(i !== undefined && a[i] > b[i] ? "yes" : "no")
            ' "$1" "$2"
          }
          MAJOR="${PKG_VERSION%%.*}"
          NEXT_MAJOR="${NEXT%%.*}"
          # Without --tag npm makes every publish `latest`; an older major must not take `latest` or `next`.
          case "$PKG_VERSION" in
            *-*)
              if [ "$MAJOR" -ge "${LATEST%%.*}" ] && [ "$MAJOR" -ge "${NEXT_MAJOR:-0}" ]; then TAG=next; else TAG="v$MAJOR-next"; fi
              ;;
            *)
              if [ "$(higher "$PKG_VERSION" "$LATEST")" = yes ]; then TAG=latest; else TAG="v$MAJOR-latest"; fi
              ;;
          esac
          npm publish --access public --provenance --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
